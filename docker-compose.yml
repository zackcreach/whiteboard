services:
  whiteboard:
    build: .
    image: whiteboard:latest
    container_name: whiteboard
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - PHX_SERVER=true
      - PHX_HOST=symphony
      - PHX_SCHEME=http
      - PHX_PORT=4000
      - PHX_CHECK_ORIGIN=http://symphony:4000,http://localhost:4000
      - PORT=4000
      - POOL_SIZE=10
      - MIX_ENV=prod
      - DATABASE_URL=ecto://postgres:postgres@db:5432/whiteboard_prod
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - whiteboard_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    container_name: whiteboard_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=whiteboard_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - whiteboard_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  whiteboard_network:
    driver: bridge
